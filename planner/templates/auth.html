{% extends "base.html" %}
{% load i18n %}
{% block body %}
<main class="auth card">
  <p class="eyebrow">{% translate "Productivity Studio" %}</p>
  <h1>{{ heading }}</h1>
  {% if email %}<p>{{ email }}</p>{% endif %}
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button class="primary" type="submit">{{ heading }}</button>
  </form>
</main>
{% endblock %}
